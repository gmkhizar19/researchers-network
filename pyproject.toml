[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "researchers-network"
version = "0.1.0"
description = "Co-authorship network analysis over OpenAlex data, stored in Neo4j and served to a React graph UI."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "neo4j>=5.24",
  "networkx>=3.3",
  "numpy>=2.0",
  "pandas>=2.2",
  "pydantic-settings>=2.4",
  "python-dotenv>=1.0",
  "matplotlib>=3.9",
  "scikit-learn>=1.5",
  "scipy>=1.14",
  "tenacity>=8.5",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "respx>=0.21",
  "ruff>=0.6",
]

[project.scripts]
rn-crawl = "crawler.cli:main"
rn-analysis = "analysis.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["crawler", "analysis", "backend"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["crawler", "analysis", "backend", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["crawler", "analysis", "backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
markers = [
  "neo4j: integration test that needs the Neo4j container running (skipped when it is down)",
]
filterwarnings = ["error::DeprecationWarning:backend.*"]
